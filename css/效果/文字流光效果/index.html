<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .streaming-text {
        width: fit-content;
        color: transparent;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        background-size: 150% 100%;
        animation: text-gradient-loading 1.2s ease-in-out infinite;
        background-image: linear-gradient(270deg, #8f91a8 2%, #2c2c36 97%);
      }
      @keyframes text-gradient-loading {
        0% {
          background-position: 150% 100%;
        }

        to {
          background-position: -150% 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="streaming-text">流光文本...</div>
  </body>
</html>
